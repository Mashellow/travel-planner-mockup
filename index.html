<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's U Plan - Smart Travel Map</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#2563eb',
                            600: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS & JS (สำหรับแสดงแผนที่และหมุด) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom Marker Card Style */
        .custom-pin-card {
            width: 140px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #3b82f6;
            transition: transform 0.2s;
        }
        .custom-pin-card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

    <!-- Navbar Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between">
        <!-- Logo -->
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white w-9 h-9 rounded-full flex items-center justify-center font-bold text-lg shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div>
                <h1 class="text-lg font-extrabold text-blue-500 leading-none">Let's U Plan</h1>
                <span class="text-[9px] text-slate-400 tracking-wider font-semibold uppercase">SMART TRAVEL MAP</span>
            </div>
        </div>

        <!-- Menu Tabs -->
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
            <a href="#" class="text-blue-400 border-b-2 border-blue-500 pb-1 flex items-center gap-2">
                <i class="fa-solid fa-compass"></i> ค้นหา & วางแผน
            </a>
            <a href="#" class="text-slate-400 hover:text-white flex items-center gap-2 transition-colors">
                <i class="fa-regular fa-calendar-alt"></i> ตารางทริปของฉัน
            </a>
            <a href="#" class="text-slate-400 hover:text-white flex items-center gap-2 transition-colors">
                <i class="fa-solid fa-photo-film"></i> Moments (รีวิว)
            </a>
        </nav>

        <!-- Right System Actions -->
        <div class="flex items-center gap-3 text-xs">
            <button id="darkModeToggle" onclick="toggleDarkMode()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all border border-slate-700">
                <i class="fa-solid fa-moon"></i> โหมดมืด
            </button>
            <span class="bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-500/20 flex items-center gap-1.5 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> โหมดระบบแผนที่ใหม่
            </span>
            <button class="bg-slate-800 hover:bg-slate-700 text-white font-medium px-4 py-1.5 rounded-full border border-slate-700 flex items-center gap-1.5 transition-all">
                <i class="fa-solid fa-user-circle"></i> เข้าสู่ระบบ
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 grid grid-cols-12 gap-4 p-4">
        
        <!-- Map Canvas Panel (Left Side) -->
        <section class="col-span-12 lg:col-span-7 xl:col-span-8 relative rounded-2xl overflow-hidden border border-slate-800 bg-slate-900 min-h-[550px]">
            <!-- Map Filter Overlay Header -->
            <div class="absolute top-4 left-4 right-4 z-[1000] flex justify-between items-center bg-slate-900/90 backdrop-blur-md px-4 py-2.5 rounded-xl border border-slate-700/60 shadow-lg">
                <div class="flex items-center gap-2 text-xs text-slate-300 font-medium">
                    <i class="fa-solid fa-filter text-blue-400"></i>
                    <span>กรองหมวดหมู่บนแผนที่:</span>
                </div>
                <select id="categoryFilter" onchange="filterCategory()" class="bg-slate-800 text-white text-xs border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">ทั้งหมด</option>
                    <option value="resort">ที่พัก & รีสอร์ท</option>
                    <option value="attraction">สถานที่ท่องเที่ยว / วัด</option>
                </select>
            </div>

            <!-- Leaflet Container -->
            <div id="map" class="w-full h-full min-h-[550px] z-10"></div>
        </section>

        <!-- Travel Planner Config Panel (Right Side) -->
        <section class="col-span-12 lg:col-span-5 xl:col-span-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 text-slate-800 dark:text-slate-100 flex flex-col justify-between shadow-2xl">
            <div class="space-y-5">
                <!-- Header Title -->
                <div>
                    <h2 class="text-lg font-bold flex items-center gap-2 text-slate-900 dark:text-white">
                        <i class="fa-solid fa-sliders text-blue-500"></i> ค้นหาจุดหมาย & วางแผน
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        คลิกการ์ดบนแผนที่เพื่อดูรายละเอียดและใส่ทริป
                    </p>
                </div>

                <!-- Input Controls Area -->
                <div class="space-y-4">
                    <!-- Country & Province Selection -->
                    <div>
                        <label class="block text-xs font-semibold mb-1.5 text-slate-700 dark:text-slate-300">
                            เลือกประเทศและเมือง <span class="text-red-500">*</span>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="countrySelect" class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="TH">TH ประเทศไทย</option>
                                <option value="JP">JP ญี่ปุ่น</option>
                                <option value="VN">VN เวียดนาม</option>
                            </select>
                            <select id="provinceSelect" onchange="renderMapPins()" class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all">-- ทั้งประเทศ --</option>
                                <option value="Phuket">ภูเก็ต</option>
                                <option value="Bangkok">กรุงเทพมหานคร</option>
                            </select>
                        </div>
                    </div>

                    <!-- Search Input -->
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="searchInput" oninput="renderMapPins()" placeholder="หรือพิมพ์ค้นหาสถานที่เฉพาะ..." class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl pl-8 pr-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <!-- Budget & Date Selection (Updated: Integrated Calendar Start/End Date) -->
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-slate-700 dark:text-slate-300">
                                งบประมาณ (บาท)
                            </label>
                            <input type="number" id="budgetInput" value="25000" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <!-- Calendar Pickers for Start and End Dates -->
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-slate-700 dark:text-slate-300">
                                เลือกช่วงวันเดินทาง (วันไป - วันกลับ)
                            </label>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <span class="text-[10px] text-slate-400 block mb-0.5">วันไป</span>
                                    <input type="date" id="startDate" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-2.5 py-2 text-xs font-medium text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-400 block mb-0.5">วันกลับ</span>
                                    <input type="date" id="endDate" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-2.5 py-2 text-xs font-medium text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3 mt-6">
                <button onclick="autoPlanWizard()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-blue-500/25 transition-all">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Auto Plan Wizard
                </button>
                <button onclick="customDIYPlan()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all border border-slate-200 dark:border-slate-700">
                    <i class="fa-regular fa-pen-to-square"></i> Plan เอง (DIY)
                </button>
            </div>
        </section>

    </main>

    <!-- JavaScript Implementation -->
    <script>
        // Sample Destination Mock Data matching original screenshot
        const destinations = [
            {
                id: 1,
                name: "หาดกมลา วังรีสอร์ท",
                category: "resort",
                province: "Phuket",
                price: "฿250",
                lat: 7.9519,
                lng: 98.2831,
                image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200&q=80"
            },
            {
                id: 2,
                name: "วัดพระแก้วมรกต...",
                category: "attraction",
                province: "Bangkok",
                price: "฿500",
                lat: 13.7516,
                lng: 100.4927,
                image: "https://images.unsplash.com/photo-1563492065599-3520f775eeed?w=200&q=80"
            },
            {
                id: 3,
                name: "Sri Panwa Resort",
                category: "resort",
                province: "Phuket",
                price: "฿16,500",
                lat: 7.8024,
                lng: 98.4081,
                image: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=200&q=80"
            }
        ];

        let map;
        let markersGroup;

        // Initialize App & Map on Load
        document.addEventListener("DOMContentLoaded", () => {
            // Set Default Dates for Calendar Pickers (Start Date = Today, End Date = Today + 4 days)
            const today = new Date();
            const endDate = new Date();
            endDate.setDate(today.getDate() + 4);

            document.getElementById('startDate').value = today.toISOString().split('T')[0];
            document.getElementById('endDate').value = endDate.toISOString().split('T')[0];

            // Initialize Leaflet Map
            map = L.map('map', { zoomControl: false }).setView([10.0, 100.0], 6);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            L.control.zoom({ position: 'topLeft' }).addTo(map);
            markersGroup = L.layerGroup().addTo(map);

            // Render Map Pins
            renderMapPins();
        });

        // Bug Fix 4: Dark Mode Toggle targeting document.documentElement for Tailwind dark: working correctly
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            const btn = document.getElementById('darkModeToggle');
            
            if (isDark) {
                btn.innerHTML = `<i class="fa-solid fa-moon"></i> โหมดมืด`;
            } else {
                btn.innerHTML = `<i class="fa-solid fa-sun"></i> โหมดสว่าง`;
            }
        }

        // Bug Fix 4 & Requirement 3: Full Implementation of renderMapPins()
        function renderMapPins() {
            if (!markersGroup) return;
            
            // Clear existing pins
            markersGroup.clearLayers();

            const category = document.getElementById('categoryFilter').value;
            const province = document.getElementById('provinceSelect').value;
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();

            // Filter logic
            const filteredPlaces = destinations.filter(item => {
                const matchCategory = category === 'all' || item.category === category;
                const matchProvince = province === 'all' || item.province === province;
                const matchSearch = item.name.toLowerCase().includes(searchKeyword);
                return matchCategory && matchProvince && matchSearch;
            });

            // Create markers on Leaflet
            filteredPlaces.forEach(place => {
                const customIcon = L.divIcon({
                    className: 'custom-leaflet-marker',
                    html: `
                        <div class="custom-pin-card bg-slate-900 text-white border-2 border-blue-500 rounded-lg overflow-hidden shadow-xl">
                            <div class="relative h-16 w-full">
                                <img src="${place.image}" class="w-full h-full object-cover" alt="${place.name}">
                                <span class="absolute bottom-1 right-1 bg-blue-600 text-white font-bold text-[10px] px-1.5 py-0.5 rounded shadow">
                                    ${place.price}
                                </span>
                            </div>
                            <div class="p-1.5 text-center font-semibold text-[11px] truncate bg-slate-800 text-slate-100">
                                ${place.name}
                            </div>
                        </div>
                    `,
                    iconSize: [140, 85],
                    iconAnchor: [70, 42]
                });

                const marker = L.marker([place.lat, place.lng], { icon: customIcon });
                marker.bindPopup(`<strong class="text-sm">${place.name}</strong><br>ราคา: ${place.price}`);
                markersGroup.addLayer(marker);
            });
        }

        function filterCategory() {
            renderMapPins();
        }

        function autoPlanWizard() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const budget = document.getElementById('budgetInput').value;

            if (!startDate || !endDate) {
                alert("กรุณาเลือกช่วงวันเดินทาง (วันไป - วันกลับ) ให้ครบถ้วน");
                return;
            }

            alert(`เริ่มคำนวณแผนการเดินทางอัตโนมัติ!\n📅 เดินทาง: ${startDate} ถึง ${endDate}\n💰 งบประมาณ: ${parseInt(budget).toLocaleString()} บาท`);
        }

        function customDIYPlan() {
            alert("เข้าสู่ระบบสร้างแผนการเดินทางด้วยตนเอง (DIY)");
        }
    </script>
</body>
</html>
